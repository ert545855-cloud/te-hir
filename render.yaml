services:
  - type: web
    name: raf-takip
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raf-takip-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"

databases:
  - name: raf-takip-db
    plan: free
    region: frankfurt
    databaseName: raf_takip_db
    user: raf_takip_db_user
    postgresMajorVersion: "16"
